[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terraform-provider-qubes"
# Version is sourced from the root `version` file (single source of truth shared
# with the RPM `@VERSION@` substitution); see [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "Terraform/OpenTofu provider for Qubes OS, bound to the Python Admin API (qubesadmin)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "tf>=1.2.0",
    # NOTE: `qubesadmin` is shipped by Qubes OS (the qubes-core-admin-client RPM),
    # not installed from PyPI. It is available in dom0 and management qubes only.
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
# Terraform/OpenTofu expects an executable named terraform-provider-<name>.
terraform-provider-qubes = "qubes_provider.main:main"

[tool.setuptools.dynamic]
version = { file = ["version"] }

[tool.setuptools.packages.find]
include = ["qubes_provider*"]

[tool.pytest.ini_options]
testpaths = ["tests"]